# micro-cache for the proxied market API — shields the upstream, speeds responses
proxy_cache_path /tmp/napi_cache levels=1:2 keys_zone=napi:1m max_size=16m inactive=10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Always revalidate the HTML entrypoint
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # --- Live market data: server-side proxy to Naver Finance (avoids browser CORS) ---
    location = /napi/kospi {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $naver_m "m.stock.naver.com";
        proxy_pass https://$naver_m/api/index/KOSPI/price;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host m.stock.naver.com;
        proxy_ssl_server_name on;
        proxy_ssl_name m.stock.naver.com;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_set_header Accept "application/json";
        proxy_set_header Referer "https://m.stock.naver.com/";
        proxy_connect_timeout 5s;
        proxy_read_timeout 8s;
        proxy_cache napi;
        proxy_cache_valid 200 20s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "no-store" always;
    }
    location = /napi/kosdaq {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $naver_m "m.stock.naver.com";
        proxy_pass https://$naver_m/api/index/KOSDAQ/price;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host m.stock.naver.com;
        proxy_ssl_server_name on;
        proxy_ssl_name m.stock.naver.com;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_set_header Accept "application/json";
        proxy_set_header Referer "https://m.stock.naver.com/";
        proxy_connect_timeout 5s;
        proxy_read_timeout 8s;
        proxy_cache napi;
        proxy_cache_valid 200 20s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "no-store" always;
    }
    location = /napi/usdkrw {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $naver_a "api.stock.naver.com";
        proxy_pass https://$naver_a/marketindex/exchange/FX_USDKRW/prices;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.stock.naver.com;
        proxy_ssl_server_name on;
        proxy_ssl_name api.stock.naver.com;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_set_header Accept "application/json";
        proxy_set_header Referer "https://m.stock.naver.com/";
        proxy_connect_timeout 5s;
        proxy_read_timeout 8s;
        proxy_cache napi;
        proxy_cache_valid 200 20s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "no-store" always;
    }
}
